name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: sec-xbrl-warehouse

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sec-xbrl-warehouse/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest -m "not integration" --cov --cov-report=term-missing
      - run: python scripts/scan_stubs.py

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xbrl_control
          POSTGRES_USER: xbrl
          POSTGRES_PASSWORD: xbrl_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xbrl -d xbrl_control"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_DB: xbrl
          CLICKHOUSE_USER: xbrl
          CLICKHOUSE_PASSWORD: xbrl_dev_password
        ports: ["8123:8123"]
        options: >-
          --health-cmd "clickhouse-client --user xbrl --password xbrl_dev_password --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sec-xbrl-warehouse/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: cp .env.example .env
      - run: docker compose up -d --wait minio
      - run: python -m pytest -m integration
        env:
          XBRL_ENV: test
          RUN_XBRL_INTEGRATION: "1"
          XBRL_OBJECT_STORE_ENDPOINT: http://localhost:9002
