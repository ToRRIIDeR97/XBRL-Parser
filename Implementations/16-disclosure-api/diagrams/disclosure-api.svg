<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Plan 16: disclosure read endpoints, current and proposed</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Current</text>
  <text x="470" y="28" font-size="16" font-weight="bold" fill="#222">Proposed (changes in blue)</text>

  <!-- current -->
  <rect x="20" y="45" width="190" height="120" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="32" y="67" font-weight="bold" fill="#222">FastAPI routers</text>
  <text x="32" y="88" fill="#222">/v1/facts</text>
  <text x="32" y="106" fill="#222">/v1/series</text>
  <text x="32" y="124" fill="#222">/v1/filings/{accession}</text>
  <text x="32" y="142" fill="#222">/health</text>
  <rect x="20" y="195" width="190" height="50" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="32" y="225" fill="#222">QueryService (bounded)</text>
  <rect x="20" y="275" width="410" height="105" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="32" y="297" font-weight="bold" fill="#222">ClickHouse (xbrl_api, budgeted profile)</text>
  <text x="32" y="318" fill="#222">v_xbrl_facts_latest, v_canonical_facts_latest, metric_series</text>
  <text x="32" y="340" fill="#888">v_cover_pages_latest, v_segment_facts_latest,</text>
  <text x="32" y="358" fill="#888">v_text_blocks_latest: SQL only, no API route</text>
  <line x1="115" y1="165" x2="115" y2="193" stroke="#444" marker-end="url(#a)"/>
  <line x1="115" y1="245" x2="115" y2="273" stroke="#444" marker-end="url(#a)"/>

  <!-- proposed -->
  <rect x="470" y="45" width="410" height="140" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="482" y="67" font-weight="bold" fill="#222">routers/filings.py</text>
  <text x="482" y="88" fill="#222">/v1/filings/{accession}</text>
  <text x="482" y="110" fill="#1f5fbf">+ /cover-page            (AC-1, 404 if none)</text>
  <text x="482" y="130" fill="#1f5fbf">+ /segments  kind, concept, eliminations (AC-2)</text>
  <text x="482" y="150" fill="#1f5fbf">+ /text-blocks  policy, concept, include_text (AC-3)</text>
  <text x="482" y="172" fill="#1f5fbf">422 before any query on bad input (AC-4)</text>
  <rect x="470" y="205" width="410" height="50" rx="6" fill="#e8f0fc" stroke="#1f5fbf"/>
  <text x="482" y="228" fill="#1f5fbf">QueryService: cover_page, segment_facts, text_blocks</text>
  <text x="482" y="246" fill="#1f5fbf">parameterized SQL, limit/offset caps</text>
  <rect x="470" y="275" width="410" height="105" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="482" y="297" font-weight="bold" fill="#222">ClickHouse views (unchanged, latest revision)</text>
  <text x="482" y="318" fill="#222">v_cover_pages_latest</text>
  <text x="482" y="338" fill="#222">v_segment_facts_latest</text>
  <text x="482" y="358" fill="#222">v_text_blocks_latest (AC-6: newest revision only)</text>
  <line x1="675" y1="185" x2="675" y2="203" stroke="#1f5fbf" marker-end="url(#a)"/>
  <line x1="675" y1="255" x2="675" y2="273" stroke="#1f5fbf" marker-end="url(#a)"/>
</svg>
