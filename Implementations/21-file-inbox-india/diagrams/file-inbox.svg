<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Plan 21: operator file inbox adapter with NSE and MCA profiles</title>
  <rect width="960" height="320" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">No crawling: the operator supplies files obtained under the source's terms</text>

  <rect x="20" y="50" width="250" height="140" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="32" y="72" font-weight="bold" fill="#222">Operator (outside the app)</text>
  <text x="32" y="92" fill="#222">NSE / BSE results XBRL files,</text>
  <text x="32" y="110" fill="#222">MCA financial statements (paid),</text>
  <text x="32" y="128" fill="#222">licensed vendor exports</text>
  <text x="32" y="150" fill="#222">→ data/inbox/&lt;source&gt;/</text>
  <text x="32" y="170" fill="#222">   index.csv + files</text>

  <rect x="320" y="50" width="300" height="160" rx="6" fill="#e8f0fc" stroke="#1f5fbf"/>
  <text x="332" y="72" font-weight="bold" fill="#1f5fbf">InboxSourceAdapter (sources/inbox.py)</text>
  <text x="332" y="92" fill="#1f5fbf">profiles: nse (ISIN), mca (CIN)</text>
  <text x="332" y="112" fill="#1f5fbf">discover: validated index rows (AC-1)</text>
  <text x="332" y="132" fill="#1f5fbf">download: path containment, digest,</text>
  <text x="332" y="150" fill="#1f5fbf">size, one instance → package (AC-2, AC-3)</text>
  <text x="332" y="170" fill="#1f5fbf">no HTTP client, no egress lock (AC-4)</text>
  <text x="332" y="190" fill="#1f5fbf">inbox check CLI: dry run (AC-5)</text>

  <rect x="670" y="50" width="270" height="70" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="682" y="72" font-weight="bold" fill="#222">Registry and worker (plan 18)</text>
  <text x="682" y="92" fill="#222">discover_filings {"source": "nse"}</text>
  <text x="682" y="110" fill="#222">fetch → parse, as other sources</text>

  <rect x="670" y="140" width="270" height="70" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="682" y="162" fill="#222">bronze/nse/filings/&lt;entity key&gt;/nse-…/</text>
  <text x="682" y="182" fill="#222">packages/sha256=…/package.zip</text>

  <rect x="320" y="230" width="620" height="70" rx="6" fill="#e8f0fc" stroke="#1f5fbf"/>
  <text x="332" y="252" font-weight="bold" fill="#1f5fbf">Taxonomies (AC-6, operator pins)</text>
  <text x="332" y="272" fill="#1f5fbf">NSE/BSE capital-market results taxonomies and the MCA Ind AS taxonomy;</text>
  <text x="332" y="290" fill="#1f5fbf">source_required_prefixes for nse and mca; parse offline</text>

  <line x1="270" y1="120" x2="318" y2="120" stroke="#1f5fbf" marker-end="url(#b)"/>
  <line x1="620" y1="85" x2="668" y2="85" stroke="#1f5fbf" marker-end="url(#b)"/>
  <line x1="620" y1="160" x2="668" y2="170" stroke="#1f5fbf" marker-end="url(#b)"/>
</svg>
