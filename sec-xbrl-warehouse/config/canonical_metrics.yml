# Canonical metric catalogue. Formula metrics (statement: derived) are computed from
# other metrics and never have concept candidates. `additive: false` marks averages,
# per-share values, and share counts: series keep their reported quarters, years, and
# instants but never difference or sum them (no YTD quarters, Q4 = FY - 9M, or TTM).
version: 2
metrics:
- code: revenue
  name: Revenue
  statement: income_statement
  period_type: duration
  unit_family: monetary
  description: Consolidated top-line revenue as reported by the entity.
- code: cost_of_revenue
  name: Cost of Revenue
  statement: income_statement
  period_type: duration
  unit_family: monetary
  description: Cost of goods and services sold.
- code: gross_profit
  name: Gross Profit
  statement: income_statement
  period_type: duration
  unit_family: monetary
- code: research_and_development
  name: Research and Development Expense
  statement: income_statement
  period_type: duration
  unit_family: monetary
- code: selling_general_administrative
  name: Selling, General and Administrative Expense
  statement: income_statement
  period_type: duration
  unit_family: monetary
- code: operating_income
  name: Operating Income
  statement: income_statement
  period_type: duration
  unit_family: monetary
- code: interest_expense
  name: Interest Expense
  statement: income_statement
  period_type: duration
  unit_family: monetary
- code: income_tax_expense
  name: Income Tax Expense
  statement: income_statement
  period_type: duration
  unit_family: monetary
  description: Total income tax expense (benefit).
- code: net_income
  name: Net Income
  statement: income_statement
  period_type: duration
  unit_family: monetary
- code: basic_eps
  name: Basic EPS
  statement: income_statement
  period_type: duration
  unit_family: monetary_per_share
  additive: false
- code: diluted_eps
  name: Diluted EPS
  statement: income_statement
  period_type: duration
  unit_family: monetary_per_share
  additive: false
- code: basic_shares
  name: Basic Weighted-Average Shares
  statement: income_statement
  period_type: duration
  unit_family: shares
  additive: false
- code: diluted_shares
  name: Diluted Weighted-Average Shares
  statement: income_statement
  period_type: duration
  unit_family: shares
  additive: false
- code: shares_outstanding
  name: Common Shares Outstanding
  statement: balance_sheet
  period_type: instant
  unit_family: shares
  additive: false
  description: Common shares outstanding at the balance sheet or cover date.
- code: operating_cash_flow
  name: Cash Flow from Operations
  statement: cash_flow
  period_type: duration
  unit_family: monetary
- code: capital_expenditures
  name: Capital Expenditures
  statement: cash_flow
  period_type: duration
  unit_family: monetary
  description: Payments to acquire property, plant, and equipment.
- code: depreciation_amortization
  name: Depreciation and Amortization
  statement: cash_flow
  period_type: duration
  unit_family: monetary
- code: share_based_compensation
  name: Share-Based Compensation
  statement: cash_flow
  period_type: duration
  unit_family: monetary
- code: share_repurchases
  name: Share Repurchases
  statement: cash_flow
  period_type: duration
  unit_family: monetary
  description: Payments to repurchase common stock.
- code: dividends_paid
  name: Dividends Paid
  statement: cash_flow
  period_type: duration
  unit_family: monetary
- code: acquisitions
  name: Acquisitions, Net of Cash Acquired
  statement: cash_flow
  period_type: duration
  unit_family: monetary
- code: debt_issued
  name: Proceeds from Debt Issuance
  statement: cash_flow
