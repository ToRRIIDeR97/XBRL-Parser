# Taxonomy package registry used by the Arelle adapter.
#
# Each entry pins one immutable package file: its HTTPS source URL (on an allowed
# taxonomy host) and SHA-256. `xbrl-warehouse taxonomy sync` downloads enabled
# packages into XBRL_ARELLE_TAXONOMY_PACKAGES_DIR and verifies them;
# `xbrl-warehouse taxonomy status` and `doctor` report their state. Packages are
# verified again before every extraction. Package files are never committed.
#
# Only published zips with META-INF/taxonomyPackage.xml (the XBRL Taxonomy
# Packages format) can be loaded by Arelle; others are pinned but disabled, and
# their taxonomies resolve through the allowlisted web cache. See
# docs/OPERATIONS.md, "Taxonomy packages", for adding a new taxonomy year.
#
# Checksums were recorded from the published files on 5 October 2026.
