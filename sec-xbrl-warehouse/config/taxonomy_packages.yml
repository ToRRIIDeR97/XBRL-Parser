# Taxonomy source registry used by the Arelle adapter.
#
# Each entry pins one immutable, unmodified file published by the taxonomy owner:
# its HTTPS source URL (on an allowed taxonomy host) and SHA-256.
# `xbrl-warehouse taxonomy sync` downloads enabled entries into
# XBRL_ARELLE_TAXONOMY_PACKAGES_DIR and verifies them; `xbrl-warehouse taxonomy
# status` and `doctor` report their state and any required prefix without an
# enabled source. Every extraction verifies them again. Files are never committed.
#
# Kinds:
#   package  XBRL Taxonomy Package (META-INF/taxonomyPackage.xml); Arelle reads its
#            catalog. `prefixes` records what it serves, for the coverage check.
#   archive  Official zip mapped by explicit URI prefix -> directory in the zip.
#            Used for zips without package metadata and for the SEC combined
#            annual zips, whose catalogs rewrite all of https://xbrl.sec.gov/.
#   file     A schema published only as an individual file; `mappings` lists its URL.
# Every prefix also maps under the other scheme (http/https).
#
# See docs/OPERATIONS.md, "Taxonomy packages", for adding a taxonomy year.
# Checksums were recorded from the published files on 5 October 2026.
