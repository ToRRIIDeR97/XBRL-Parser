network_policy:
  # Filing documents themselves must come from the checksum-addressed filing
  # package. These hosts are the candidates for taxonomy package downloads and
  # for controlled standard-taxonomy cache fills when XBRL_ARELLE_OFFLINE=false.
  # The effective list is XBRL_ARELLE_ALLOWED_TAXONOMY_HOSTS.
  allowed_taxonomy_hosts:
    - www.sec.gov
    - xbrl.sec.gov
    - xbrl.fasb.org
    - xbrl.ifrs.org
    - www.xbrl.org
  reject_unlisted_hosts: true
  require_https: true
