name: sec-xbrl-warehouse

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xbrl_control}
      POSTGRES_USER: ${POSTGRES_USER:-xbrl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xbrl_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xbrl} -d ${POSTGRES_DB:-xbrl_control}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-xbrl}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-xbrl}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-xbrl_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xbrl_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xbrl_minio_dev_password}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: minio/mc:${MINIO_MC_IMAGE_TAG:-latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-xbrl_minio} ${MINIO_ROOT_PASSWORD:-xbrl_minio_dev_password};
      mc mb --ignore-existing local/${XBRL_OBJECT_STORE_BUCKET:-sec-xbrl};
      mc anonymous set none local/${XBRL_OBJECT_STORE_BUCKET:-sec-xbrl};
      exit 0;
      "

  api:
    profiles: ["application"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: .env
    environment:
      XBRL_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-xbrl}:${POSTGRES_PASSWORD:-xbrl_dev_password}@postgres:5432/${POSTGRES_DB:-xbrl_control}
      XBRL_CLICKHOUSE_HOST: clickhouse
      XBRL_OBJECT_STORE_ENDPOINT: http://minio:9000
    volumes:
      - app_data:/app/data
    command: ["api", "serve"]
    ports:
      - "${XBRL_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["application"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: .env
    environment:
      XBRL_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-xbrl}:${POSTGRES_PASSWORD:-xbrl_dev_password}@postgres:5432/${POSTGRES_DB:-xbrl_control}
      XBRL_CLICKHOUSE_HOST: clickhouse
      XBRL_OBJECT_STORE_ENDPOINT: http://minio:9000
    volumes:
      - app_data:/app/data
    command: ["worker", "run"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  app_data:
