name: sec-xbrl-warehouse

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xbrl_control}
      POSTGRES_USER: ${POSTGRES_USER:-xbrl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xbrl_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xbrl} -d ${POSTGRES_DB:-xbrl_control}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-xbrl}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-xbrl}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-xbrl_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xbrl_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xbrl_minio_dev_password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: minio/mc:${MINIO_MC_IMAGE_TAG:-latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-xbrl_minio} ${MINIO_ROOT_PASSWORD:-xbrl_minio_dev_password};
      mc mb --ignore-existing local/${XBRL_OBJECT_STORE_BUCKET:-sec-xbrl};
      mc anonymous set none local/${XBRL_OBJECT_STORE_BUCKET:-sec-xbrl};
      exit 0;
      "

  api:
    profiles: ["application", "monitoring"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: .env
    environment:
      XBRL_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-xbrl}:${POSTGRES_PASSWORD:-xbrl_dev_password}@postgres:5432/${POSTGRES_DB:-xbrl_control}
      XBRL_CLICKHOUSE_HOST: clickhouse
      XBRL_OBJECT_STORE_ENDPOINT: http://minio:9000
      XBRL_API_HOST: 0.0.0.0
    volumes:
      - app_data:/app/data
    command: ["api", "serve"]
    ports:
      - "127.0.0.1:${XBRL_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["application", "monitoring"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: .env
    environment:
      XBRL_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-xbrl}:${POSTGRES_PASSWORD:-xbrl_dev_password}@postgres:5432/${POSTGRES_DB:-xbrl_control}
      XBRL_CLICKHOUSE_HOST: clickhouse
      XBRL_OBJECT_STORE_ENDPOINT: http://minio:9000
      XBRL_WORKER_METRICS_HOST: 0.0.0.0
    volumes:
      - app_data:/app/data
    command: ["worker", "run"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-latest}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
      - worker
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-latest}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  app_data:
  prometheus_data:
  grafana_data:
