<title id="t">UML activity view: bulk FSNDS backfill</title>
<desc id="d">Swimlane activity for historical SEC bulk data: catalog sync and backfill planning, download_bulk acquisition, and load_bulk validation, loading, reconciliation, quarantine, and failure handling.</desc>
