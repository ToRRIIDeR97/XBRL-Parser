<text x="290" y="818" font-size="11" text-anchor="start">fetch_filing takes the egress lock the same way (not drawn).</text>
<text x="290" y="833" font-size="11" text-anchor="start">A worker claims only its --job-type set and builds the SEC</text>
<text x="290" y="848" font-size="11" text-anchor="start">client only for SEC job types (worker.requires_sec).</text>
<text x="290" y="863" font-size="11" text-anchor="start">Every stage saves a job checkpoint, so a retry resumes</text>
<text x="290" y="878" font-size="11" text-anchor="start">after the last completed stage. Failures follow the job</text>
<text x="290" y="893" font-size="11" text-anchor="start">state machine (retry with backoff or dead).</text>
<rect x="740" y="780" width="240" height="50" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="860.0" y="801.775" font-size="11.5" text-anchor="middle">Claim parse_filing;</text>
<text x="860.0" y="816.275" font-size="11.5" text-anchor="middle">load stored manifest</text>
<rect x="740" y="860" width="240" height="50" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="860.0" y="881.775" font-size="11.5" text-anchor="middle">Fetch package.zip from S3;</text>
<text x="860.0" y="896.275" font-size="11.5" text-anchor="middle">verify SHA-256 + members</text>
