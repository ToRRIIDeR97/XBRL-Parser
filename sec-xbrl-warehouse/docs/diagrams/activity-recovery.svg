<rect x="380" y="195" width="190" height="62" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="475.0" y="215.525" font-size="11.5" text-anchor="middle">defer: retry later,</text>
<text x="475.0" y="230.025" font-size="11.5" text-anchor="middle">attempt not counted;</text>
<text x="475.0" y="244.525" font-size="11.5" text-anchor="middle">dead after max_defer</text>
