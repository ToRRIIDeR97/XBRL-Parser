<circle cx="1110" cy="710" r="11" fill="#ffffff" stroke="#3d444d" stroke-width="1.4"/>
<circle cx="1110" cy="710" r="6.5" fill="#3d444d"/>
<path d="M1040,710 L1099,710" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="20" y="790" font-size="11" text-anchor="start" class="m">¹ The repository has no dedicated ClickHouse rebuild command; replaying silver Parquet is a documented intent, not a scripted procedure.</text>
