<text x="326" y="220" font-size="11" text-anchor="start" font-style="italic" class="m">[yes]</text>
<circle cx="475" cy="286" r="9" fill="#ffffff" stroke="#3d444d" stroke-width="1.4"/>
<path d="M468.7,279.7 L481.3,292.3 M481.3,279.7 L468.7,292.3" stroke="#3d444d" stroke-width="1.4"/>
<path d="M475,257 L475,277" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
