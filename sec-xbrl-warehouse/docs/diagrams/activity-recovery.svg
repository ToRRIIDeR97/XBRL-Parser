<rect x="600" y="70" width="580" height="30" rx="0" fill="#eef1f4" stroke="#3d444d" stroke-width="1"/>
<text x="890.0" y="90" font-size="12.5" text-anchor="middle" font-weight="600">Restore drill (operator)</text>
