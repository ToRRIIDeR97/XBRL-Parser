<path d="M300,210 L316,226 L300,242 L284,226 Z" fill="#ffffff" stroke="#3d444d" stroke-width="1.3"/>
<text x="278" y="230" font-size="11" text-anchor="end" font-style="italic" class="m">egress busy?</text>
