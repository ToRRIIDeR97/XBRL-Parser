<text x="390.0" y="449" font-size="11" text-anchor="middle" class="m">pinned digest</text>
<text x="390.0" y="463" font-size="11" text-anchor="middle" class="m">volume postgres_data</text>
<text x="390.0" y="477" font-size="11" text-anchor="middle" class="m">127.0.0.1:5432</text>
