<text x="650.0" y="107" font-size="10.5" text-anchor="middle" class="m">«device»</text>
<text x="650.0" y="123" font-size="13" text-anchor="middle" font-weight="600">Docker host</text>
<path d="M270,160 L280,150 L520,150 L520,278 L510,288 L510,160 Z" fill="#e6e9ed" stroke="#3d444d" stroke-width="1.2"/>
