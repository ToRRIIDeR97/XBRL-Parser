<text x="390.0" y="177" font-size="10.5" text-anchor="middle" class="m">«container»</text>
<text x="390.0" y="193" font-size="13" text-anchor="middle" font-weight="600">worker  [application]</text>
<text x="390.0" y="209" font-size="11" text-anchor="middle" class="m">artifact: sec-xbrl-warehouse image</text>
<text x="390.0" y="223" font-size="11" text-anchor="middle" class="m">cmd: worker run</text>
<text x="390.0" y="237" font-size="11" text-anchor="middle" class="m">.env, admin secrets blanked</text>
<text x="390.0" y="251" font-size="11" text-anchor="middle" class="m">volume app_data:/app/data</text>
<text x="390.0" y="265" font-size="11" text-anchor="middle" class="m">fetch, discover, bulk; 1 per source</text>
<path d="M540,160 L550,150 L790,150 L790,278 L780,288 L780,160 Z" fill="#e6e9ed" stroke="#3d444d" stroke-width="1.2"/>
<path d="M780,160 L790,150" stroke="#3d444d" stroke-width="1.2"/>
