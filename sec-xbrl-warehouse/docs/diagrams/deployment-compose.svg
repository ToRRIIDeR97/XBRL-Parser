<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" role="img" aria-labelledby="t d">
<title id="t">UML deployment view: Docker Compose topology</title>
<desc id="d">Docker Compose services on one host: application containers built from the warehouse image with least-privilege identities, pinned storage and monitoring images on the internal backend network, their volumes and loopback ports, the on-demand admin service, and external SEC hosts.</desc>
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#3d444d" stroke-width="1.4"/></marker>
<marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3d444d"/></marker>
<marker id="diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 Z" fill="#3d444d"/></marker>
</defs>
<style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { fill: #57606a; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
</style>
<rect width="1300" height="760" fill="#ffffff"/>
<text x="20" y="30" font-size="17" text-anchor="start" font-weight="600">Deployment view · Docker Compose (docker-compose.yml)</text>
<text x="20" y="50" font-size="11.5" text-anchor="start" class="m">Solid lines are communication paths. Bracketed names are Compose profiles; services without one start by default.</text>
