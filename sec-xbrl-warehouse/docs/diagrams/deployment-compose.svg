<text x="925.0" y="177" font-size="10.5" text-anchor="middle" class="m">«container»</text>
<text x="925.0" y="193" font-size="13" text-anchor="middle" font-weight="600">api  [application]</text>
<text x="925.0" y="209" font-size="11" text-anchor="middle" class="m">artifact: sec-xbrl-warehouse image</text>
<text x="925.0" y="223" font-size="11" text-anchor="middle" class="m">cmd: api serve, :8080</text>
<text x="925.0" y="237" font-size="11" text-anchor="middle" class="m">reader DSNs only; no .env,</text>
<text x="925.0" y="251" font-size="11" text-anchor="middle" class="m">no app_data volume</text>
