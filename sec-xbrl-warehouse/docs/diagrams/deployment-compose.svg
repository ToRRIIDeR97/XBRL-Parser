<text x="820" y="608" font-size="10.5" text-anchor="start">App containers: UID 10001,</text>
<text x="820" y="622.5" font-size="10.5" text-anchor="start">cap_drop ALL, no-new-privileges.</text>
<text x="820" y="637.0" font-size="10.5" text-anchor="start">worker, admin, api, storage, and</text>
<text x="820" y="651.5" font-size="10.5" text-anchor="start">monitoring also join the default</text>
<text x="820" y="666.0" font-size="10.5" text-anchor="start">network (internet, host ports);</text>
<text x="820" y="680.5" font-size="10.5" text-anchor="start">worker-parse does not.</text>
