<text x="660.0" y="177" font-size="10.5" text-anchor="middle" class="m">«container»</text>
<text x="660.0" y="193" font-size="13" text-anchor="middle" font-weight="600">worker-parse  [parse]</text>
<text x="660.0" y="209" font-size="11" text-anchor="middle" class="m">artifact: sec-xbrl-warehouse image</text>
<text x="660.0" y="223" font-size="11" text-anchor="middle" class="m">cmd: worker run --job-type</text>
<text x="660.0" y="237" font-size="11" text-anchor="middle" class="m">parse_filing; offline Arelle</text>
<text x="660.0" y="251" font-size="11" text-anchor="middle" class="m">volume app_data, mem 8g</text>
<text x="660.0" y="265" font-size="11" text-anchor="middle" class="m">backend network only</text>
