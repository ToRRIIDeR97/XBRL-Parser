<text x="660.0" y="433" font-size="13" text-anchor="middle" font-weight="600">minio + minio-init</text>
<text x="660.0" y="449" font-size="11" text-anchor="middle" class="m">volume minio_data</text>
<text x="660.0" y="463" font-size="11" text-anchor="middle" class="m">127.0.0.1:9002 (API), :9003</text>
<text x="660.0" y="477" font-size="11" text-anchor="middle" class="m">init: private, versioned bucket;</text>
<text x="660.0" y="491" font-size="11" text-anchor="middle" class="m">xbrl_worker user, no delete</text>
