<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 300" width="1260" height="300" role="img" aria-labelledby="t d">
<title id="t">Development workflow</title>
<desc id="d">Feature branch, change with tests and documents, local validation gates, pull request, explicit user approval, merge to main, then delete the branch.</desc>
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#3d444d" stroke-width="1.4"/></marker>
<marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3d444d"/></marker>
<marker id="diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 Z" fill="#3d444d"/></marker>
</defs>
<style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { fill: #57606a; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
</style>
<rect width="1260" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" text-anchor="start" font-weight="600">Development workflow (UML activity)</text>
<text x="20" y="50" font-size="11.5" text-anchor="start" class="m">Required checks run locally; GitHub Actions is manual-only.</text>
<circle cx="34" cy="130" r="8" fill="#3d444d"/>
<rect x="60" y="104" width="220" height="52" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="170.0" y="126.775" font-size="11.5" text-anchor="middle">Read AGENTS.md, HANDOFF.md,</text>
<text x="170.0" y="141.275" font-size="11.5" text-anchor="middle">ARCHITECTURE.md, DATA_MODEL.md</text>
<path d="M42,130 L60,130" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<rect x="310" y="104" width="170" height="52" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="395.0" y="126.775" font-size="11.5" text-anchor="middle">git switch -c &lt;branch&gt;</text>
<text x="395.0" y="141.275" font-size="11.5" text-anchor="middle">(never commit to main)</text>
<path d="M280,130 L310,130" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<rect x="510" y="104" width="200" height="52" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="610.0" y="126.775" font-size="11.5" text-anchor="middle">Change code + tests;</text>
<text x="610.0" y="141.275" font-size="11.5" text-anchor="middle">update owning docs/diagrams</text>
<path d="M480,130 L510,130" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<rect x="740" y="104" width="170" height="52" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="825.0" y="126.775" font-size="11.5" text-anchor="middle">Run Validate gates</text>
<text x="825.0" y="141.275" font-size="11.5" text-anchor="middle">(sec-xbrl-warehouse/)</text>
<path d="M710,130 L740,130" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<path d="M944,114 L960,130 L944,146 L928,130 Z" fill="#ffffff" stroke="#3d444d" stroke-width="1.3"/>
<path d="M910,130 L928,130" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<path d="M944,114 L944,82 L610,82 L610,104" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="780" y="76" font-size="11" text-anchor="middle" class="halo">[any gate fails]</text>
<rect x="990" y="104" width="110" height="52" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="1045.0" y="126.775" font-size="11.5" text-anchor="middle">Open PR</text>
<text x="1045.0" y="141.275" font-size="11.5" text-anchor="middle">to main</text>
<path d="M960,130 L990,130" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="966" y="160" font-size="11" text-anchor="middle" font-style="italic" class="m">[all pass]</text>
<rect x="1120" y="104" width="125" height="52" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="1182.5" y="126.775" font-size="11.5" text-anchor="middle">User approves;</text>
<text x="1182.5" y="141.275" font-size="11.5" text-anchor="middle">merge PR</text>
<path d="M1100,130 L1120,130" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<rect x="880" y="210" width="365" height="52" rx="12" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="1062.5" y="232.775" font-size="11.5" text-anchor="middle">Verify in main; delete branch: git push origin --delete,</text>
<text x="1062.5" y="247.275" font-size="11.5" text-anchor="middle">git switch main &amp;&amp; git pull, git branch -d, git fetch --prune</text>
<path d="M1182,156 L1182,210" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<circle cx="846" cy="236" r="11" fill="#ffffff" stroke="#3d444d" stroke-width="1.4"/>
<circle cx="846" cy="236" r="6.5" fill="#3d444d"/>
<path d="M880,236 L858,236" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<path d="M60,186 L648,186 L660,198 L660,282 L60,282 Z" fill="#fffbe6" stroke="#3d444d" stroke-width="1.1"/>
<path d="M648,186 L648,198 L660,198" fill="none" stroke="#3d444d" stroke-width="1.1"/>
<text x="70" y="204" font-size="11" text-anchor="start">Validate gates: python -m compileall -q src tests scripts · ruff check . · ruff format --check .</text>
<text x="70" y="219" font-size="11" text-anchor="start">mypy src · pytest -m &quot;not integration&quot; · python scripts/scan_stubs.py</text>
<text x="70" y="234" font-size="11" text-anchor="start">RUN_XBRL_INTEGRATION=1 pytest -m integration (needs local Postgres, ClickHouse, MinIO)</text>
<text x="70" y="249" font-size="11" text-anchor="start">If branch protection blocks the merge on a CI status, report it; don&#x27;t bypass it.</text>
<text x="70" y="264" font-size="11" text-anchor="start">Use git branch -D only after confirming a squash/rebase-merged PR shows as merged.</text>
</svg>
