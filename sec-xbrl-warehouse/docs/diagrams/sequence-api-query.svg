<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 720" width="1110" height="720" role="img" aria-labelledby="t d">
<title id="t">UML sequence view: raw fact query</title>
<desc id="d">Authentication, concurrency limiting, request validation, budgeted ClickHouse query, and the 401, 503, and 422 failure replies for GET /v1/facts.</desc>
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#3d444d" stroke-width="1.4"/></marker>
<marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3d444d"/></marker>
<marker id="diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 Z" fill="#3d444d"/></marker>
</defs>
<style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { fill: #57606a; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
</style>
<rect width="1110" height="720" fill="#ffffff"/>
<text x="20" y="30" font-size="17" text-anchor="start" font-weight="600">Sequence view · GET /v1/facts</text>
<text x="20" y="50" font-size="11.5" text-anchor="start" class="m">/health/live skips auth and limits; /health/ready skips auth and has a one-slot limit. Other routes follow the same middleware.</text>
<rect x="5.0" y="68" width="170" height="34" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="90" y="90" font-size="12" text-anchor="middle" font-weight="600">API client</text>
<path d="M90,102 L90,700" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="235.0" y="68" width="170" height="44" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="320" y="83" font-size="10" text-anchor="middle" class="m">api/app.py</text>
<text x="320" y="100" font-size="12" text-anchor="middle" font-weight="600">HTTP middleware</text>
<path d="M320,112 L320,700" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="475.0" y="68" width="170" height="44" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="560" y="83" font-size="10" text-anchor="middle" class="m">api/routers/facts.py</text>
<text x="560" y="100" font-size="12" text-anchor="middle" font-weight="600">Router + FactQuery</text>
<path d="M560,112 L560,700" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="715.0" y="68" width="170" height="44" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="800" y="83" font-size="10" text-anchor="middle" class="m">query/service.py</text>
<text x="800" y="100" font-size="12" text-anchor="middle" font-weight="600">QueryService</text>
<path d="M800,112 L800,700" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="925.0" y="68" width="170" height="44" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="1010" y="83" font-size="10" text-anchor="middle" class="m">xbrl_api reader</text>
<text x="1010" y="100" font-size="12" text-anchor="middle" font-weight="600">ClickHouse</text>
<path d="M1010,112 L1010,700" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<path d="M90,140 L320,140" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="98" y="135" font-size="11" text-anchor="start" class="halo">GET /v1/facts?cik=… (Authorization: Bearer)</text>
<path d="M320,194 L90,194" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="312" y="189" font-size="11" text-anchor="end" class="halo">401 Unauthorized</text>
<path d="M320,248 L90,248" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="312" y="243" font-size="11" text-anchor="end" class="halo">503 Query capacity reached</text>
<path d="M320,302 L560,302" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="328" y="297" font-size="11" text-anchor="start" class="halo">call_next (holds one api_max_concurrency slot)</text>
<path d="M560,356 L90,356" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="552" y="351" font-size="11" text-anchor="end" class="halo">422 validation error</text>
<path d="M560,410 L800,410" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="568" y="405" font-size="11" text-anchor="start" class="halo">raw_facts(query)</text>
<path d="M800,438 L1010,438" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="808" y="433" font-size="11" text-anchor="start" class="halo">SELECT … with time, memory, rows, bytes budgets</text>
<path d="M1010,492 L320,492" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1002" y="487" font-size="11" text-anchor="end" class="halo">DatabaseError → 503 &quot;exceeded its resource budget&quot;</text>
<path d="M1010,546 L800,546" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1002" y="541" font-size="11" text-anchor="end" class="halo">rows</text>
<path d="M800,574 L560,574" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="792" y="569" font-size="11" text-anchor="end" class="halo">list[dict]</text>
<path d="M560,602 L90,602" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="552" y="597" font-size="11" text-anchor="end" class="halo">200 {items, limit, offset, count}</text>
<rect x="680" y="458" width="400" height="166" rx="0" fill="none" stroke="#3d444d" stroke-width="1.1"/>
<path d="M680,476 L708,476 L716,468 L716,458" fill="#ffffff" stroke="#3d444d" stroke-width="1.1"/>
<text x="686" y="471" font-size="11" text-anchor="start" font-weight="600">alt</text>
<text x="724" y="472" font-size="11" text-anchor="start" font-style="italic" class="halo">[budget exceeded or DB error]</text>
<path d="M680,512 L1080,512" stroke="#3d444d" stroke-width="1" stroke-dasharray="6 4"/>
<text x="688" y="526" font-size="11" text-anchor="start" font-style="italic" class="halo">[ok]</text>
<rect x="450" y="322" width="640" height="310" rx="0" fill="none" stroke="#3d444d" stroke-width="1.1"/>
<path d="M450,340 L478,340 L486,332 L486,322" fill="#ffffff" stroke="#3d444d" stroke-width="1.1"/>
<text x="456" y="335" font-size="11" text-anchor="start" font-weight="600">alt</text>
<text x="494" y="336" font-size="11" text-anchor="start" font-style="italic" class="halo">[no cik, accession, or ≤ 366-day window]</text>
<path d="M450,376 L1090,376" stroke="#3d444d" stroke-width="1" stroke-dasharray="6 4"/>
<text x="458" y="390" font-size="11" text-anchor="start" font-style="italic" class="halo">[valid]</text>
<rect x="20" y="160" width="1075" height="480" rx="0" fill="none" stroke="#3d444d" stroke-width="1.1"/>
<path d="M20,178 L48,178 L56,170 L56,160" fill="#ffffff" stroke="#3d444d" stroke-width="1.1"/>
<text x="26" y="173" font-size="11" text-anchor="start" font-weight="600">alt</text>
<text x="64" y="174" font-size="11" text-anchor="start" font-style="italic" class="halo">[API key set ∧ header mismatch]</text>
<path d="M20,214 L1095,214" stroke="#3d444d" stroke-width="1" stroke-dasharray="6 4"/>
<text x="28" y="228" font-size="11" text-anchor="start" font-style="italic" class="halo">[all slots busy]</text>
<path d="M20,268 L1095,268" stroke="#3d444d" stroke-width="1" stroke-dasharray="6 4"/>
<text x="28" y="282" font-size="11" text-anchor="start" font-style="italic" class="halo">[else]</text>
</svg>
