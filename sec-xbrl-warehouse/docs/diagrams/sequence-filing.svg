<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 1140" width="1370" height="1140" role="img" aria-labelledby="t d">
<title id="t">UML sequence view: discover, fetch, and parse a filing</title>
<desc id="d">Ordered messages between the CLI, PostgreSQL queue, per-source egress lock, fetch worker, source hosts (SEC EDGAR), object store, parse worker, Arelle, and ClickHouse, including the egress-busy deferral and the rejected-extraction path.</desc>
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#3d444d" stroke-width="1.4"/></marker>
<marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3d444d"/></marker>
<marker id="diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 Z" fill="#3d444d"/></marker>
</defs>
<style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { fill: #57606a; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
</style>
<rect width="1370" height="1140" fill="#ffffff"/>
<text x="20" y="30" font-size="17" text-anchor="start" font-weight="600">Sequence view · discover → fetch_filing → parse_filing</text>
<text x="20" y="50" font-size="11.5" text-anchor="start" class="m">Filled arrows are calls; dashed arrows are replies. Each claimed job also heartbeats every lock_timeout/3 until it finishes (not drawn).</text>
<rect x="12.0" y="68" width="136" height="34" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="80" y="90" font-size="12" text-anchor="middle" font-weight="600">CLI / cron</text>
<path d="M80,102 L80,1120" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="162.0" y="68" width="136" height="44" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="230" y="83" font-size="10" text-anchor="middle" class="m">«datastore»</text>
<text x="230" y="100" font-size="12" text-anchor="middle" font-weight="600">PostgreSQL</text>
<path d="M230,112 L230,1120" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="312.0" y="68" width="136" height="34" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
