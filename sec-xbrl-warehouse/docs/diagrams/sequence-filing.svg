<path d="M380,102 L380,1120" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="462.0" y="68" width="136" height="34" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="530" y="90" font-size="12" text-anchor="middle" font-weight="600">Fetch worker</text>
<path d="M530,102 L530,1120" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="612.0" y="68" width="136" height="44" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="680" y="83" font-size="10" text-anchor="middle" class="m">«external» source hosts</text>
<text x="680" y="100" font-size="12" text-anchor="middle" font-weight="600">SEC EDGAR</text>
<path d="M680,112 L680,1120" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="762.0" y="68" width="136" height="44" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="830" y="83" font-size="10" text-anchor="middle" class="m">«datastore»</text>
<text x="830" y="100" font-size="12" text-anchor="middle" font-weight="600">MinIO / S3</text>
<path d="M830,112 L830,1120" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="912.0" y="68" width="136" height="34" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="980" y="90" font-size="12" text-anchor="middle" font-weight="600">Parse worker</text>
<path d="M980,102 L980,1120" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="1062.0" y="68" width="136" height="44" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="1130" y="83" font-size="10" text-anchor="middle" class="m">child process</text>
<text x="1130" y="100" font-size="12" text-anchor="middle" font-weight="600">Arelle</text>
<path d="M1130,112 L1130,1120" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="1212.0" y="68" width="136" height="44" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="1280" y="83" font-size="10" text-anchor="middle" class="m">«datastore»</text>
<text x="1280" y="100" font-size="12" text-anchor="middle" font-weight="600">ClickHouse</text>
<path d="M1280,112 L1280,1120" stroke="#57606a" stroke-width="1" stroke-dasharray="5 4"/>
<path d="M80,140 L230,140" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="88" y="135" font-size="11" text-anchor="start" class="halo">enqueue discover_filings</text>
<path d="M530,168 L230,168" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="522" y="163" font-size="11" text-anchor="end" class="halo">claim_job (SKIP LOCKED)</text>
<path d="M530,196 L380,196" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="522" y="191" font-size="11" text-anchor="end" class="halo">acquire xbrl:&lt;source&gt;-egress (first request)</text>
<path d="M380,250 L530,250" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="388" y="245" font-size="11" text-anchor="start" class="halo">EgressBusyError (SEC: SecEgressBusyError)</text>
<path d="M530,278 L230,278" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="522" y="273" font-size="11" text-anchor="end" class="halo">fail_job(defer): retry, attempt not counted</text>
<path d="M530,332 L680,332" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="538" y="327" font-size="11" text-anchor="start" class="halo">adapter(payload.source).discover: SEC daily index or submissions JSON</text>
<path d="M680,360 L530,360" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="672" y="355" font-size="11" text-anchor="end" class="halo">filings, company data</text>
<path d="M530,388 L230,388" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="522" y="383" font-size="11" text-anchor="end" class="halo">refuse other sources; upsert companies; enqueue fetch_filing each</text>
<path d="M530,416 L230,416" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="522" y="411" font-size="11" text-anchor="end" class="halo">complete_job</text>
<rect x="300" y="216" width="600" height="222" rx="0" fill="none" stroke="#3d444d" stroke-width="1.1"/>
<path d="M300,234 L328,234 L336,226 L336,216" fill="#ffffff" stroke="#3d444d" stroke-width="1.1"/>
<text x="306" y="229" font-size="11" text-anchor="start" font-weight="600">alt</text>
<text x="344" y="230" font-size="11" text-anchor="start" font-style="italic" class="halo">[lock held by another process]</text>
<path d="M300,298 L900,298" stroke="#3d444d" stroke-width="1" stroke-dasharray="6 4"/>
<text x="308" y="312" font-size="11" text-anchor="start" font-style="italic" class="halo">[acquired]</text>
<path d="M530,458 L230,458" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="522" y="453" font-size="11" text-anchor="end" class="halo">claim_job → fetch_filing</text>
<path d="M530,486 L680,486" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="538" y="481" font-size="11" text-anchor="start" class="halo">registry.download_package → adapter: FilingSummary.xml, then members</text>
<path d="M530,514 L830,514" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="538" y="509" font-size="11" text-anchor="start" class="halo">put package.zip (deterministic) + manifest</text>
<path d="M530,542 L230,542" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="522" y="537" font-size="11" text-anchor="end" class="halo">update_filing_package; checkpoint package</text>
<path d="M530,570 L230,570" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="522" y="565" font-size="11" text-anchor="end" class="halo">enqueue parse_filing (parse:&lt;acc&gt;:&lt;rev&gt;); complete_job</text>
<path d="M980,608 L230,608" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="603" font-size="11" text-anchor="end" class="halo">claim_job → parse_filing</text>
<path d="M980,636 L230,636" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="631" font-size="11" text-anchor="end" class="halo">get_filing_manifest</text>
<path d="M980,664 L830,664" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="659" font-size="11" text-anchor="end" class="halo">get package.zip; verify SHA-256 + members</text>
<path d="M980,692 L1130,692" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="988" y="687" font-size="11" text-anchor="start" class="halo">extract(entrypoint)</text>
<path d="M1130,720 L980,720" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1122" y="715" font-size="11" text-anchor="end" class="halo">XbrlExtractionBundle</text>
<path d="M980,748 L830,748" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="743" font-size="11" text-anchor="end" class="halo">put extraction .json.zst; checkpoint extract</text>
<path d="M980,776 L230,776" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="771" font-size="11" text-anchor="end" class="halo">registry.fiscal_focus; record grouped validation issues</text>
<path d="M980,830 L830,830" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="825" font-size="11" text-anchor="end" class="halo">put quarantine/filing/&lt;accession&gt;/…</text>
<path d="M980,858 L230,858" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="853" font-size="11" text-anchor="end" class="halo">fail_job → retry or dead</text>
<path d="M980,912 L830,912" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="907" font-size="11" text-anchor="end" class="halo">silver Parquet per entity; checkpoint silver:&lt;entity&gt;</text>
<path d="M980,940 L1280,940" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="988" y="935" font-size="11" text-anchor="start" class="halo">insert_xbrl_bundle; checkpoint gold</text>
<path d="M980,968 L1280,968" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="988" y="963" font-size="11" text-anchor="start" class="halo">insert canonical facts; checkpoint canonical</text>
<path d="M980,996 L1280,996" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="988" y="991" font-size="11" text-anchor="start" class="halo">publish_xbrl_bundle: verify counts, revision marker</text>
<path d="M980,1024 L230,1024" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="1019" font-size="11" text-anchor="end" class="halo">enqueue_series_rebuild: coalesced rebuild_series job (series:&lt;cik&gt;)</text>
<path d="M980,1052 L230,1052" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="972" y="1047" font-size="11" text-anchor="end" class="halo">complete_job</text>
