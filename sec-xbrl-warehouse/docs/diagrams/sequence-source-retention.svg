<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 465" role="img"><title>Optional source package retirement</title><desc>Opt-in cleanup runs after publication and saving the completion checkpoint, verifies the retained extraction, then deletes only the source ZIP. Failed loads and active consumers keep the source. An admin command handles old completed jobs after checking the same proofs.</desc><rect width="1100" height="465" fill="#f6f8fb"/><rect x="20" y="20" width="245" height="45" fill="#dce9f4" rx="5"/><text x="142" y="47" font-family="sans-serif" font-size="14" fill="#18324a" text-anchor="middle">Parser / completed replay</text><path d="M142 65V405" stroke="#8298ac" stroke-dasharray="4 5"/><rect x="295" y="20" width="245" height="45" fill="#dce9f4" rx="5"/><text x="417" y="47" font-family="sans-serif" font-size="14" fill="#18324a" text-anchor="middle">PostgreSQL checkpoints</text><path d="M417 65V405" stroke="#8298ac" stroke-dasharray="4 5"/><rect x="570" y="20" width="245" height="45" fill="#dce9f4" rx="5"/><text x="692" y="47" font-family="sans-serif" font-size="14" fill="#18324a" text-anchor="middle">MinIO / S3</text><path d="M692 65V405" stroke="#8298ac" stroke-dasharray="4 5"/><rect x="845" y="20" width="245" height="45" fill="#dce9f4" rx="5"/><text x="967" y="47" font-family="sans-serif" font-size="14" fill="#18324a" text-anchor="middle">ClickHouse publication</text><path d="M967 65V405" stroke="#8298ac" stroke-dasharray="4 5"/><path d="M142 105H967" stroke="#285b81"/><text x="154" y="95" font-family="sans-serif" font-size="13" fill="#18324a">1. Publish and reconcile; errors keep source</text><path d="M142 155H417" stroke="#285b81"/><text x="154" y="145" font-family="sans-serif" font-size="13" fill="#18324a">2. Save completion; check other source consumers</text><path d="M417 205H142" stroke="#285b81"/><text x="154" y="195" font-family="sans-serif" font-size="13" fill="#18324a">3. Package + extract + completion proofs</text><path d="M142 255H692" stroke="#285b81"/><text x="154" y="245" font-family="sans-serif" font-size="13" fill="#18324a">4. Download retained extraction; verify SHA-256</text><path d="M142 305H692" stroke="#285b81"/><text x="154" y="295" font-family="sans-serif" font-size="13" fill="#18324a">5. retain=false → DELETE source package ZIP only</text><path d="M692 355H142" stroke="#285b81"/><text x="154" y="345" font-family="sans-serif" font-size="13" fill="#18324a">6. Versioned store retains noncurrent bytes for 30 days</text><text x="20" y="435" font-family="sans-serif" font-size="13" fill="#18324a">Admin cleanup: completed_filing_sources + publication marker → same verification/deletion. Pending consumers defer deletion.</text><text x="20" y="455" font-family="sans-serif" font-size="12" fill="#18324a">Sources: incremental.py _cleanup_source; maintenance.py delete_filing_source / prune_filing_sources; postgres.py; docker-compose.yml policy.</text></svg>