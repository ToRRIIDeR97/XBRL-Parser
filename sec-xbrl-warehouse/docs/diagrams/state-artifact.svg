<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">UML state machine: bulk source artifact lifecycle</title>
<desc id="d">States of a source_artifacts row (ArtifactState) as allowed by _ALLOWED_ARTIFACT_TRANSITIONS and set by upsert_source_artifact and BulkArtifactLoader.load_artifact.</desc>
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#3d444d" stroke-width="1.4"/></marker>
<marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3d444d"/></marker>
<marker id="diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 Z" fill="#3d444d"/></marker>
</defs>
<style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { fill: #57606a; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
</style>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="20" y="30" font-size="17" text-anchor="start" font-weight="600">State machine · bulk source artifact (ArtifactState)</text>
<text x="20" y="50" font-size="11.5" text-anchor="start" class="m">Allowed transitions: _ALLOWED_ARTIFACT_TRANSITIONS in infrastructure/storage/postgres.py. Composite states group shared exits.</text>
<rect x="20" y="120" width="1160" height="175" rx="16" fill="#fbfdfb" stroke="#3d444d" stroke-width="1.2"/>
<text x="32" y="140" font-size="12" text-anchor="start" font-weight="600">in progress</text>
<rect x="565" y="150" width="600" height="125" rx="14" fill="#f6fbf6" stroke="#3d444d" stroke-width="1.1"/>
<text x="577" y="168" font-size="11.5" text-anchor="start" font-weight="600">checking and loading</text>
<circle cx="34" cy="88" r="8" fill="#3d444d"/>
<path d="M110,72 L126,88 L110,104 L94,88 Z" fill="#ffffff" stroke="#3d444d" stroke-width="1.3"/>
<path d="M42,88 L94,88" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<rect x="40" y="180" width="140" height="60" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="110.0" y="200" font-size="13" text-anchor="middle" font-weight="600">discovered</text>
<rect x="210" y="180" width="140" height="60" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="280.0" y="200" font-size="13" text-anchor="middle" font-weight="600">downloading</text>
<rect x="380" y="180" width="140" height="60" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="450.0" y="200" font-size="13" text-anchor="middle" font-weight="600">acquired</text>
<rect x="580" y="190" width="160" height="60" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="660.0" y="210" font-size="13" text-anchor="middle" font-weight="600">validating</text>
<rect x="770" y="190" width="160" height="60" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="850.0" y="210" font-size="13" text-anchor="middle" font-weight="600">loading</text>
<rect x="960" y="190" width="180" height="60" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="1050.0" y="210" font-size="13" text-anchor="middle" font-weight="600">reconciling</text>
<path d="M110,104 L110,180" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="116" y="160" font-size="11" text-anchor="start" font-style="italic" class="m">[no object]</text>
<path d="M126,88 L450,88 L450,180" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="290" y="82" font-size="11" text-anchor="middle" class="halo">upsert_source_artifact [object_key stored]</text>
<path d="M180,210 L210,210" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<path d="M350,210 L380,210" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<path d="M520,215 L580,215" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<path d="M740,220 L770,220" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<path d="M930,220 L960,220" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<rect x="990" y="340" width="170" height="56" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="1075.0" y="360" font-size="13" text-anchor="middle" font-weight="600">complete</text>
<path d="M1080,250 L1080,340" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="1086" y="320" font-size="11" text-anchor="start" class="halo">/ details.load_stats</text>
<circle cx="1075" cy="440" r="11" fill="#ffffff" stroke="#3d444d" stroke-width="1.4"/>
<circle cx="1075" cy="440" r="6.5" fill="#3d444d"/>
<path d="M1075,396 L1075,429" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<rect x="200" y="440" width="200" height="60" rx="14" fill="#fdecec" stroke="#3d444d" stroke-width="1.2"/>
<text x="300.0" y="460" font-size="13" text-anchor="middle" font-weight="600">failed</text>
<rect x="640" y="440" width="220" height="60" rx="14" fill="#fdecec" stroke="#3d444d" stroke-width="1.2"/>
<text x="750.0" y="460" font-size="13" text-anchor="middle" font-weight="600">quarantined</text>
<path d="M330,295 L330,440" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="336" y="360" font-size="11" text-anchor="start" class="halo">[other error]</text>
<text x="336" y="374" font-size="11" text-anchor="start" class="m halo">(the job retries transient ones)</text>
<path d="M800,275 L800,440" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="806" y="336" font-size="11" text-anchor="start" class="halo">[ArtifactIntegrityError ∨</text>
<text x="806" y="350" font-size="11" text-anchor="start" class="halo">SchemaDriftError ∨</text>
<text x="806" y="364" font-size="11" text-anchor="start" class="halo">DataQualityError]</text>
<text x="806" y="378" font-size="11" text-anchor="start" class="m halo">/ diagnostic in quarantine/bulk/</text>
<path d="M240,440 L240,240" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="234" y="400" font-size="11" text-anchor="end" class="halo">retry download</text>
<path d="M400,470 L610,470 L610,250" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="505" y="463" font-size="11" text-anchor="middle" class="halo">retry load</text>
<path d="M690,440 L690,250" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="696" y="400" font-size="11" text-anchor="start" class="halo">re-validate</text>
<path d="M20,530 L1168,530 L1180,542 L1180,582 L20,582 Z" fill="#fffbe6" stroke="#3d444d" stroke-width="1.1"/>
<path d="M1168,530 L1168,542 L1180,542" fill="none" stroke="#3d444d" stroke-width="1.1"/>
<text x="30" y="548" font-size="11" text-anchor="start">Current code stores the bulk ZIP before upserting the artifact, so new artifacts start as acquired. No ingestion path sets discovered or downloading.</text>
<text x="30" y="563" font-size="11" text-anchor="start">load_artifact marks a row left in loading or reconciling as failed before re-validating it.</text>
</svg>
