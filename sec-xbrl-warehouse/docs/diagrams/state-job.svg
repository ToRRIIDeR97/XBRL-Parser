<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="t d">
<title id="t">UML state machine: ingestion job lifecycle</title>
<desc id="d">States of an ingestion_jobs row (JobState) and the guarded transitions made by enqueue_job, claim_job, complete_job, fail_job, and jobs retry in infrastructure/storage/postgres.py.</desc>
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#3d444d" stroke-width="1.4"/></marker>
<marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3d444d"/></marker>
<marker id="diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 Z" fill="#3d444d"/></marker>
</defs>
<style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { fill: #57606a; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
</style>
<rect width="1120" height="640" fill="#ffffff"/>
<text x="20" y="30" font-size="17" text-anchor="start" font-weight="600">State machine · ingestion job (JobState)</text>
<text x="20" y="50" font-size="11.5" text-anchor="start" class="m">Transitions are trigger [guard] / effect. Times use PostgreSQL now(); source: infrastructure/storage/postgres.py.</text>
<circle cx="32" cy="170" r="8" fill="#3d444d"/>
<rect x="70" y="140" width="170" height="60" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="155.0" y="160" font-size="13" text-anchor="middle" font-weight="600">pending</text>
<path d="M70,168 L240,168" stroke="#3d444d" stroke-width="1"/>
<text x="155.0" y="184" font-size="10.5" text-anchor="middle" class="m">idempotency_key unique</text>
<path d="M40,170 L70,170" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="55" y="130" font-size="11" text-anchor="middle" class="m">enqueue_job</text>
<rect x="420" y="130" width="240" height="80" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="540.0" y="150" font-size="13" text-anchor="middle" font-weight="600">running</text>
<path d="M420,158 L660,158" stroke="#3d444d" stroke-width="1"/>
<text x="540.0" y="174" font-size="10.5" text-anchor="middle" class="m">lease: locked_by, heartbeat_at;</text>
<text x="540.0" y="188" font-size="10.5" text-anchor="middle" class="m">heartbeat every timeout/3 (≥ 5 s)</text>
<rect x="900" y="140" width="170" height="56" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="985.0" y="160" font-size="13" text-anchor="middle" font-weight="600">complete</text>
<rect x="240" y="430" width="200" height="64" rx="14" fill="#eaf5ea" stroke="#3d444d" stroke-width="1.2"/>
<text x="340.0" y="450" font-size="13" text-anchor="middle" font-weight="600">retry</text>
<path d="M240,458 L440,458" stroke="#3d444d" stroke-width="1"/>
<text x="340.0" y="474" font-size="10.5" text-anchor="middle" class="m">waits until available_at</text>
<rect x="780" y="430" width="200" height="64" rx="14" fill="#fdecec" stroke="#3d444d" stroke-width="1.2"/>
<text x="880.0" y="450" font-size="13" text-anchor="middle" font-weight="600">dead</text>
<path d="M780,458 L980,458" stroke="#3d444d" stroke-width="1"/>
<text x="880.0" y="474" font-size="10.5" text-anchor="middle" class="m">kept for operator review</text>
<path d="M240,172 L420,172" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="330" y="150" font-size="11" text-anchor="middle" class="halo">claim [available_at ≤ now()]</text>
<text x="330" y="164" font-size="11" text-anchor="middle" class="halo">/ attempts += 1</text>
<path d="M500,130 L500,96 L580,96 L580,130" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="540" y="88" font-size="11" text-anchor="middle" class="halo">claim [lease expired ∧ attempts &lt; max] / attempts += 1</text>
<path d="M660,168 L900,168" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="780" y="161" font-size="11" text-anchor="middle" class="halo">complete_job [owner ∧ attempt match]</text>
<path d="M470,210 L330,430" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="398" y="262" font-size="11" text-anchor="end" class="halo">fail_job</text>
<text x="398" y="276" font-size="11" text-anchor="end" class="halo">[retryable ∧</text>
<text x="398" y="290" font-size="11" text-anchor="end" class="halo">attempts &lt; max]</text>
<text x="398" y="304" font-size="11" text-anchor="end" class="halo">/ backoff</text>
<path d="M530,210 L410,430" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="482" y="312" font-size="11" text-anchor="start" class="halo">EgressBusyError (SEC: SecEgressBusyError)</text>
<text x="482" y="326" font-size="11" text-anchor="start" class="halo">[deferred &lt; max_defer]</text>
<text x="482" y="340" font-size="11" text-anchor="start" class="halo">/ attempts −= 1</text>
<path d="M270,430 L270,196 L420,196" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="262" y="300" font-size="11" text-anchor="end" class="halo">claim [available_at</text>
<text x="262" y="314" font-size="11" text-anchor="end" class="halo">≤ now()] / attempts += 1</text>
<path d="M620,210 L840,430" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="735" y="286" font-size="11" text-anchor="start" class="halo">fail_job [permanent ∨ attempts = max]</text>
<text x="735" y="300" font-size="11" text-anchor="start" class="halo">∨ deferral ≥ max_defer</text>
<text x="735" y="314" font-size="11" text-anchor="start" class="halo">∨ claim finds expired lease, attempts = max</text>
<path d="M780,470 L440,470" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<text x="610" y="463" font-size="11" text-anchor="middle" class="halo">jobs retry &lt;id&gt; (operator) / attempts = 0</text>
<circle cx="985" cy="262" r="11" fill="#ffffff" stroke="#3d444d" stroke-width="1.4"/>
<circle cx="985" cy="262" r="6.5" fill="#3d444d"/>
<path d="M985,196 L985,251" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#filled)"/>
<path d="M60,540 L1048,540 L1060,552 L1060,610 L60,610 Z" fill="#fffbe6" stroke="#3d444d" stroke-width="1.1"/>
<path d="M1048,540 L1048,552 L1060,552" fill="none" stroke="#3d444d" stroke-width="1.1"/>
<text x="70" y="558" font-size="11" text-anchor="start">Backoff: available_at = now() + 2^attempts s with 50–100 % jitter, capped at 1 h. failed and cancelled exist in JobState, but no code path</text>
<text x="70" y="573" font-size="11" text-anchor="start">assigns them. A worker that lost its lease gets StateTransitionError from complete_job or fail_job and the row is left alone.</text>
</svg>
