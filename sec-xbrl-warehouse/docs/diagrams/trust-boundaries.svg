<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-labelledby="t d">
<title id="t">Trust boundaries and sensitive-data flow</title>
<desc id="d">Untrusted SEC, filings.xbrl.org (ESEF), EDINET and OpenDART, and taxonomy bytes enter through the worker, are bounded and verified, and are written with least-privilege worker identities; the Arelle child holds no credentials and the parse worker has no internet route. Owner credentials stay with the on-demand admin service. The API runs with reader-only identities and bearer authentication.</desc>
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#3d444d" stroke-width="1.4"/></marker>
<marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3d444d"/></marker>
<marker id="diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 Z" fill="#3d444d"/></marker>
</defs>
<style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { fill: #57606a; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
</style>
<rect width="1240" height="700" fill="#ffffff"/>
<text x="20" y="30" font-size="17" text-anchor="start" font-weight="600">Trust boundaries and sensitive-data flow</text>
<text x="20" y="50" font-size="11.5" text-anchor="start" class="m">Dashed red frames are trust boundaries. Each arrow names the control applied where data crosses one.</text>
<rect x="20" y="80" width="230" height="450" rx="6" fill="#fff8f8" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="135" y="102" font-size="12.5" text-anchor="middle" font-weight="600">Internet (untrusted bytes)</text>
<rect x="40" y="130" width="190" height="80" rx="0" fill="#f0f0f0" stroke="#3d444d" stroke-width="1.2"/>
<text x="135.0" y="147" font-size="10.5" text-anchor="middle" class="m">«external system»</text>
<text x="135.0" y="163" font-size="13" text-anchor="middle" font-weight="600">SEC EDGAR + bulk</text>
<text x="135.0" y="179" font-size="11" text-anchor="middle" class="m">filing packages, TSV ZIPs,</text>
<text x="135.0" y="193" font-size="11" text-anchor="middle" class="m">JSON indexes</text>
<rect x="40" y="216" width="190" height="52" rx="0" fill="#f0f0f0" stroke="#3d444d" stroke-width="1.2"/>
<text x="135.0" y="231" font-size="10.5" text-anchor="middle" class="m">«external system»</text>
<text x="135.0" y="246" font-size="13" text-anchor="middle" font-weight="600">EDINET · OpenDART</text>
<text x="135.0" y="261" font-size="11" text-anchor="middle" class="m">regulators; per-user API key</text>
<rect x="40" y="274" width="190" height="66" rx="0" fill="#f0f0f0" stroke="#3d444d" stroke-width="1.2"/>
<text x="135.0" y="290" font-size="10.5" text-anchor="middle" class="m">«external system»</text>
<text x="135.0" y="306" font-size="13" text-anchor="middle" font-weight="600">Taxonomy hosts</text>
<text x="135.0" y="322" font-size="11" text-anchor="middle" class="m">pinned by URL + SHA-256</text>
<rect x="40" y="348" width="190" height="56" rx="0" fill="#f0f0f0" stroke="#3d444d" stroke-width="1.2"/>
<text x="135.0" y="365" font-size="10.5" text-anchor="middle" class="m">«external system»</text>
<text x="135.0" y="381" font-size="13" text-anchor="middle" font-weight="600">filings.xbrl.org (ESEF)</text>
<text x="135.0" y="396" font-size="11" text-anchor="middle" class="m">third-party aggregator</text>
<rect x="40" y="410" width="190" height="80" rx="0" fill="#f0f0f0" stroke="#3d444d" stroke-width="1.2"/>
<text x="135.0" y="427" font-size="10.5" text-anchor="middle" class="m">«actor»</text>
<text x="135.0" y="443" font-size="13" text-anchor="middle" font-weight="600">API client</text>
<text x="135.0" y="459" font-size="11" text-anchor="middle" class="m">holds XBRL_API_KEY</text>
<rect x="300" y="80" width="920" height="520" rx="6" fill="#f8fbff" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="760" y="102" font-size="12.5" text-anchor="middle" font-weight="600">Host / private Compose network (ports bound to 127.0.0.1)</text>
<rect x="330" y="120" width="300" height="270" rx="6" fill="#ffffff" stroke="#3d444d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="480" y="140" font-size="12" text-anchor="middle" font-weight="600">Worker identity zone</text>
<rect x="350" y="152" width="260" height="96" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="480.0" y="169" font-size="10.5" text-anchor="middle" class="m">«component»</text>
<text x="480.0" y="185" font-size="13" text-anchor="middle" font-weight="600">Workers (fetch, parse)</text>
<text x="480.0" y="201" font-size="11" text-anchor="middle" class="m">xbrl_worker DML, xbrl_writer INSERT,</text>
<text x="480.0" y="215" font-size="11" text-anchor="middle" class="m">object store without delete;</text>
<text x="480.0" y="229" font-size="11" text-anchor="middle" class="m">owner keys only in admin service</text>
<rect x="588" y="158" width="14" height="17" rx="0" fill="#ffffff" stroke="#3d444d" stroke-width="1"/>
<rect x="584" y="161" width="8" height="4" rx="0" fill="#ffffff" stroke="#3d444d" stroke-width="1"/>
<rect x="584" y="168" width="8" height="4" rx="0" fill="#ffffff" stroke="#3d444d" stroke-width="1"/>
<path d="M350,262 L598,262 L610,274 L610,378 L350,378 Z" fill="#fffbe6" stroke="#3d444d" stroke-width="1.1"/>
<path d="M598,262 L598,274 L610,274" fill="none" stroke="#3d444d" stroke-width="1.1"/>
<text x="360" y="280" font-size="10.5" text-anchor="start">Bounds before allocation: ZIP member</text>
<text x="360" y="294.5" font-size="10.5" text-anchor="start">count, bytes, ratio, traversal, symlinks;</text>
<text x="360" y="309.0" font-size="10.5" text-anchor="start">SHA-256 before parse; Arelle child: no</text>
<text x="360" y="323.5" font-size="10.5" text-anchor="start">credentials, memory limit; parse worker</text>
<text x="360" y="338.0" font-size="10.5" text-anchor="start">on internal network; HTTPS 443 taxonomy</text>
<text x="360" y="352.5" font-size="10.5" text-anchor="start">allowlist; one sender per source (lock).</text>
<rect x="330" y="420" width="300" height="160" rx="6" fill="#ffffff" stroke="#3d444d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="480" y="440" font-size="12" text-anchor="middle" font-weight="600">Reader identity zone</text>
<rect x="350" y="452" width="260" height="112" rx="0" fill="#e8f0fe" stroke="#3d444d" stroke-width="1.2"/>
<text x="480.0" y="469" font-size="10.5" text-anchor="middle" class="m">«component»</text>
<text x="480.0" y="485" font-size="13" text-anchor="middle" font-weight="600">Query API</text>
<text x="480.0" y="501" font-size="11" text-anchor="middle" class="m">secrets: XBRL_API_KEY (≥ 32 chars),</text>
<text x="480.0" y="515" font-size="11" text-anchor="middle" class="m">xbrl_api ClickHouse reader,</text>
<text x="480.0" y="529" font-size="11" text-anchor="middle" class="m">CONNECT-only PostgreSQL login;</text>
<text x="480.0" y="543" font-size="11" text-anchor="middle" class="m">no .env, no app_data volume</text>
<rect x="588" y="458" width="14" height="17" rx="0" fill="#ffffff" stroke="#3d444d" stroke-width="1"/>
<rect x="584" y="461" width="8" height="4" rx="0" fill="#ffffff" stroke="#3d444d" stroke-width="1"/>
<rect x="584" y="468" width="8" height="4" rx="0" fill="#ffffff" stroke="#3d444d" stroke-width="1"/>
<rect x="760" y="140" width="200" height="84" rx="0" fill="#fff4e0" stroke="#3d444d" stroke-width="1.2"/>
<text x="860.0" y="157" font-size="10.5" text-anchor="middle" class="m">«datastore»</text>
<text x="860.0" y="173" font-size="13" text-anchor="middle" font-weight="600">MinIO / S3</text>
<text x="860.0" y="189" font-size="11" text-anchor="middle" class="m">private, versioned bucket;</text>
<text x="860.0" y="203" font-size="11" text-anchor="middle" class="m">workers can't delete bronze</text>
<rect x="760" y="280" width="200" height="84" rx="0" fill="#fff4e0" stroke="#3d444d" stroke-width="1.2"/>
<text x="860.0" y="297" font-size="10.5" text-anchor="middle" class="m">«datastore»</text>
<text x="860.0" y="313" font-size="13" text-anchor="middle" font-weight="600">PostgreSQL</text>
<text x="860.0" y="329" font-size="11" text-anchor="middle" class="m">jobs, leases, lineage,</text>
<text x="860.0" y="343" font-size="11" text-anchor="middle" class="m">mapping approvals</text>
<rect x="760" y="430" width="200" height="96" rx="0" fill="#fff4e0" stroke="#3d444d" stroke-width="1.2"/>
<text x="860.0" y="447" font-size="10.5" text-anchor="middle" class="m">«datastore»</text>
<text x="860.0" y="463" font-size="13" text-anchor="middle" font-weight="600">ClickHouse</text>
<text x="860.0" y="479" font-size="11" text-anchor="middle" class="m">warehouse facts; reader</text>
<text x="860.0" y="493" font-size="11" text-anchor="middle" class="m">profile enforces time,</text>
<text x="860.0" y="507" font-size="11" text-anchor="middle" class="m">memory, rows, bytes</text>
<rect x="1010" y="430" width="190" height="80" rx="0" fill="#f0f0f0" stroke="#3d444d" stroke-width="1.2"/>
<text x="1105.0" y="447" font-size="10.5" text-anchor="middle" class="m">«external system»</text>
<text x="1105.0" y="463" font-size="13" text-anchor="middle" font-weight="600">Prometheus</text>
<text x="1105.0" y="479" font-size="11" text-anchor="middle" class="m">needs bearer credentials</text>
<text x="1105.0" y="493" font-size="11" text-anchor="middle" class="m">file when auth is on</text>
<path d="M230,170 L350,190" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="290" y="150" font-size="11" text-anchor="middle" class="halo">HTTPS, user agent,</text>
<text x="290" y="164" font-size="11" text-anchor="middle" class="halo">≤ 8 req/s, Retry-After</text>
<path d="M230,242 L350,210" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="290" y="219" font-size="11" text-anchor="middle" class="halo">≤ 1 req/s, own lock,</text>
<text x="290" y="233" font-size="11" text-anchor="middle" class="halo">key masked</text>
<path d="M230,370 L350,244" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="296" y="356" font-size="11" text-anchor="middle" class="halo">≤ 2 req/s, own lock,</text>
<text x="296" y="370" font-size="11" text-anchor="middle" class="halo">published SHA-256</text>
<path d="M230,300 L350,228" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="290" y="290" font-size="11" text-anchor="middle" class="halo">sync: allowlisted host,</text>
<text x="290" y="304" font-size="11" text-anchor="middle" class="halo">SHA-256 verified</text>
<path d="M230,450 L350,490" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="290" y="430" font-size="11" text-anchor="middle" class="halo">Bearer key,</text>
<text x="290" y="444" font-size="11" text-anchor="middle" class="halo">constant-time compare</text>
<path d="M610,180 L760,180" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="685" y="173" font-size="11" text-anchor="middle" class="halo">worker keys</text>
<path d="M610,215 L760,310" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="700" y="248" font-size="11" text-anchor="middle" class="halo">xbrl_worker</text>
<path d="M610,240 L760,450" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="662" y="322" font-size="11" text-anchor="end" class="halo">xbrl_writer</text>
<path d="M610,490 L760,490" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="685" y="483" font-size="11" text-anchor="middle" class="halo">SELECT-only, budgets</text>
<path d="M610,540 L735,540 L735,345 L760,345" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="729" y="455" font-size="11" text-anchor="end" class="halo">health only</text>
<path d="M1010,470 L980,470 L980,590 L480,590 L480,564" fill="none" stroke="#3d444d" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="740" y="584" font-size="11" text-anchor="middle" class="halo">/metrics with bearer</text>
<text x="20" y="626" font-size="11.5" text-anchor="start" class="m">Sensitive data: credentials and regulator API keys, the operator&#x27;s SEC contact identity,</text>
<text x="20" y="642" font-size="11.5" text-anchor="start" class="m">and the integrity of stored artifacts and lineage.</text>
<text x="20" y="658" font-size="11.5" text-anchor="start" class="m">Filing data itself is public.</text>
<text x="20" y="682" font-size="11.5" text-anchor="start" class="m">Assumption: the object store is trusted; checksums catch corruption, not a malicious storage administrator.</text>
</svg>
